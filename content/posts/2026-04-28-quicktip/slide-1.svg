<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">QUICK TIP / 30 SECONDS</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Hop. Set. Reset.</text>

  <rect x="60" y="340" width="960" height="680" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="340" width="960" height="680" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- GK in the middle with motion lines and a dashed loop -->
  <circle cx="540" cy="680" r="44" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>

  <!-- hop motion lines (small springs above) -->
  <g stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 480 470 q 10 -20 20 0"/>
    <path d="M 520 470 q 10 -20 20 0"/>
    <path d="M 560 470 q 10 -20 20 0"/>
  </g>
  <text x="540" y="440" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">HOP · HOP · HOP</text>

  <!-- set hands -->
  <circle cx="460" cy="705" r="16" fill="#FFD700"/>
  <circle cx="620" cy="705" r="16" fill="#FFD700"/>
  <line x1="502" y1="698" x2="470" y2="702" stroke="#FFD700" stroke-width="9" stroke-linecap="round"/>
  <line x1="578" y1="698" x2="610" y2="702" stroke="#FFD700" stroke-width="9" stroke-linecap="round"/>

  <!-- dashed reset loop -->
  <g fill="none" stroke="#2ECC71" stroke-width="4" stroke-dasharray="10,10">
    <path d="M 670 710 A 180 140 0 0 1 670 580" marker-end="url(#arr-accent)"/>
  </g>
  <text x="760" y="650" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">RESET</text>

  <!-- stopwatch label -->
  <text x="540" y="980" font-family="sans-serif" font-weight="800" font-size="72" fill="#F5F5F0" text-anchor="middle" letter-spacing="-1">30s</text>
  <text x="540" y="1010" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">EVERY SESSION · SAME SPOT</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Make it a ritual, not a drill.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>