<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <rect x="80" y="110" width="8" height="60" fill="#2ECC71"/>
  <text x="120" y="150" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="5">STORY · FROM THE PITCH</text>

  <text x="80" y="300" font-family="sans-serif" font-weight="800" font-size="68" fill="#F5F5F0" letter-spacing="-1">Same drills.</text>
  <text x="80" y="386" font-family="sans-serif" font-weight="800" font-size="68" fill="#F5F5F0" letter-spacing="-1">Same volume.</text>
  <text x="80" y="530" font-family="sans-serif" font-weight="800" font-size="68" fill="#2ECC71" letter-spacing="-1">Different order.</text>
  <text x="80" y="616" font-family="sans-serif" font-weight="800" font-size="68" fill="#2ECC71" letter-spacing="-1">Different keeper.</text>

  <line x1="80" y1="700" x2="400" y2="700" stroke="#F5F5F0" stroke-width="2" opacity="0.3"/>

  <!-- mini session-order diagram -->
  <rect x="80" y="750" width="880" height="120" rx="16" fill="#1a5c3f"/>

  <!-- blocks: old order -->
  <rect x="110" y="775" width="160" height="70" rx="10" fill="#2ECC71" opacity="0.7"/>
  <text x="190" y="817" font-family="sans-serif" font-weight="800" font-size="20" fill="#0f3d2e" text-anchor="middle">WARM-UP</text>
  <rect x="290" y="775" width="160" height="70" rx="10" fill="#3498DB" opacity="0.7"/>
  <text x="370" y="817" font-family="sans-serif" font-weight="800" font-size="20" fill="#0f3d2e" text-anchor="middle">TECHNICAL</text>
  <rect x="470" y="775" width="160" height="70" rx="10" fill="#FFD700" opacity="0.7"/>
  <text x="550" y="817" font-family="sans-serif" font-weight="800" font-size="18" fill="#0f3d2e" text-anchor="middle">TACTICAL</text>
  <rect x="650" y="775" width="160" height="70" rx="10" fill="#9FBFAE" opacity="0.7"/>
  <text x="730" y="817" font-family="sans-serif" font-weight="800" font-size="18" fill="#0f3d2e" text-anchor="middle">COOL-DOWN</text>

  <!-- shuffle arrows -->
  <text x="540" y="930" font-family="sans-serif" font-weight="800" font-size="28" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">SWAP THE ORDER TWICE A WEEK</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/><text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Train the keeper, not just the plan.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>