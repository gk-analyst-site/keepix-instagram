<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">PATTERN 03 / THE DROP-STEP</text><text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Ball behind. First step back.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/><rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- ball coming from above (high ball) -->
  <circle cx="540" cy="360" r="20" fill="#F5F5F0" stroke="#0f3d2e" stroke-width="2"/>
  <line x1="540" y1="382" x2="460" y2="550" stroke="#F5F5F0" stroke-width="4" stroke-dasharray="12,8" marker-end="url(#arr-white)"/>
  <text x="580" y="340" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" letter-spacing="3">HIGH BALL</text>

  <!-- GK start position -->
  <circle cx="540" cy="730" r="36" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>
  <text x="540" y="800" font-family="sans-serif" font-weight="800" font-size="20" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">START</text>

  <!-- WRONG: sideways first step (red X) -->
  <line x1="578" y1="730" x2="700" y2="730" stroke="#E74C3C" stroke-width="5"/>
  <text x="720" y="736" font-family="sans-serif" font-weight="800" font-size="28" fill="#E74C3C">&#10007;</text>
  <text x="760" y="720" font-family="sans-serif" font-weight="800" font-size="22" fill="#E74C3C" letter-spacing="2">SIDEWAYS FIRST</text>
  <text x="760" y="752" font-family="sans-serif" font-weight="400" font-size="20" fill="#9FBFAE">loses the ball</text>

  <!-- CORRECT: drop back first (green arrow) -->
  <line x1="540" y1="692" x2="500" y2="570" stroke="#FFD700" stroke-width="6" marker-end="url(#arr-gk)"/>
  <text x="320" y="570" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="2">FIRST STEP BACK</text>
  <text x="320" y="602" font-family="sans-serif" font-weight="400" font-size="20" fill="#9FBFAE">then arc to ball</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/><text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Instinct says sideways. Train it out.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>