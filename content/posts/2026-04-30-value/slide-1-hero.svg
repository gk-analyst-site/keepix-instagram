  <rect x="80" y="300" width="8" height="200" fill="#2ECC71"/>
  <text x="120" y="335" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="6">THE MOST MISUNDERSTOOD CUE</text>
  <text x="120" y="490" font-family="sans-serif" font-weight="800" font-size="150" fill="#F5F5F0" letter-spacing="-3">BEING</text>
  <text x="120" y="640" font-family="sans-serif" font-weight="800" font-size="150" fill="#2ECC71" letter-spacing="-3">SET.</text>
  <line x1="120" y1="740" x2="380" y2="740" stroke="#F5F5F0" stroke-width="3"/>
  <text x="120" y="810" font-family="sans-serif" font-weight="400" font-size="34" fill="#F5F5F0">It's a shape, not a pause.</text>
  <text x="120" y="858" font-family="sans-serif" font-weight="400" font-size="34" fill="#F5F5F0">Three things we check, every time.</text>
  <text x="120" y="980" font-family="sans-serif" font-weight="800" font-size="26" fill="#9FBFAE" letter-spacing="4">BALANCE  ·  STANCE  ·  CENTRE OF MASS</text>
  <rect x="120" y="1000" width="60" height="6" fill="#2ECC71"/>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
