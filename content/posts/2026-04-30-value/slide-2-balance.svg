<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">CHECK 01 / BALANCE</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Weight on the balls of the feet.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- side-on silhouette -->
  <g transform="translate(540, 700)">
    <!-- head -->
    <circle cx="0" cy="-180" r="40" fill="#F5F5F0"/>
    <!-- torso leaning slightly forward -->
    <path d="M -40 -140 L 30 -140 L 40 0 L -30 0 Z" fill="#F5F5F0"/>
    <!-- arms forward -->
    <path d="M 30 -130 Q 90 -80 100 0" stroke="#F5F5F0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M -40 -130 Q -100 -80 -100 0" stroke="#F5F5F0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- legs bent -->
    <path d="M -20 0 L -30 120" stroke="#F5F5F0" stroke-width="20" stroke-linecap="round"/>
    <path d="M 30 0 L 40 120" stroke="#F5F5F0" stroke-width="20" stroke-linecap="round"/>
    <!-- ground line -->
    <line x1="-200" y1="125" x2="200" y2="125" stroke="#9FBFAE" stroke-width="3"/>
    <!-- feet shadow (weight forward) -->
    <ellipse cx="-30" cy="125" rx="44" ry="8" fill="#2ECC71" opacity="0.7"/>
    <ellipse cx="40" cy="125" rx="44" ry="8" fill="#2ECC71" opacity="0.7"/>
    <!-- forward arrow -->
    <line x1="0" y1="-180" x2="160" y2="-160" stroke="#2ECC71" stroke-width="5" marker-end="url(#arr-accent)"/>
    <text x="180" y="-155" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">WEIGHT FORWARD</text>
  </g>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">A finger shouldn't push them back.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>