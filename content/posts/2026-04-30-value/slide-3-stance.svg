<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">CHECK 02 / STANCE WIDTH</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Shoulder-width. Alive.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- top-down view: yellow circle (head) with two feet ovals -->
  <g transform="translate(540, 620)">
    <!-- mint guide box indicating shoulder width -->
    <rect x="-110" y="-90" width="220" height="180" rx="8" fill="none" stroke="#2ECC71" stroke-width="3" stroke-dasharray="10,10"/>
    <text x="0" y="-110" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" text-anchor="middle" letter-spacing="3">SHOULDER WIDTH</text>

    <!-- head -->
    <circle cx="0" cy="0" r="40" fill="#FFD700" stroke="#0f3d2e" stroke-width="3"/>
    <!-- feet -->
    <ellipse cx="-85" cy="70" rx="24" ry="40" fill="#F5F5F0"/>
    <ellipse cx="85" cy="70" rx="24" ry="40" fill="#F5F5F0"/>
  </g>

  <!-- annotations left/right -->
  <text x="190" y="620" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" letter-spacing="3" text-anchor="end">TOO NARROW</text>
  <text x="190" y="650" font-family="sans-serif" font-weight="400" font-size="20" fill="#F5F5F0" text-anchor="end">lateral collapses</text>

  <text x="890" y="620" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" letter-spacing="3">TOO WIDE</text>
  <text x="890" y="650" font-family="sans-serif" font-weight="400" font-size="20" fill="#F5F5F0">first step dies</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Slightly wider for taller keepers.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>