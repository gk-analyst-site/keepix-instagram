<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">CHECK 03 / CENTRE OF MASS</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">First move across, not up.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <g transform="translate(540, 700)">
    <!-- head -->
    <circle cx="0" cy="-180" r="40" fill="#F5F5F0"/>
    <!-- torso -->
    <path d="M -40 -140 L 30 -140 L 40 0 L -30 0 Z" fill="#F5F5F0"/>
    <!-- arms out -->
    <path d="M 30 -130 Q 90 -90 110 -20" stroke="#F5F5F0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M -40 -130 Q -100 -90 -110 -20" stroke="#F5F5F0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- hips low: bent knees -->
    <path d="M -20 0 L -40 80 L -30 120" stroke="#F5F5F0" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 30 0 L 50 80 L 40 120" stroke="#F5F5F0" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- hip line marker -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#2ECC71" stroke-width="3" stroke-dasharray="10,10"/>
    <text x="170" y="8" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">HIP LINE</text>
    <!-- horizontal explosion arrows -->
    <line x1="-170" y1="-20" x2="-280" y2="-20" stroke="#FFD700" stroke-width="6" marker-end="url(#arr-gk)"/>
    <line x1="170" y1="-20" x2="280" y2="-20" stroke="#FFD700" stroke-width="6" marker-end="url(#arr-gk)"/>
    <text x="0" y="165" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">LOW &amp; LATERAL</text>
  </g>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">If first move is up, set is too tall.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>