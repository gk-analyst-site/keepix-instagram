<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">CUE 01 / THE EYES</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">A flicker, not a stare.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- striker head (top-down bird's eye: circle + shoulders hint) -->
  <g transform="translate(540, 540)">
    <circle cx="0" cy="0" r="60" fill="#F5F5F0"/>
    <!-- eyes -->
    <circle cx="-20" cy="-8" r="6" fill="#0f3d2e"/>
    <circle cx="20" cy="-8" r="6" fill="#0f3d2e"/>
    <!-- eye glance direction (mint arrow to corner) -->
    <line x1="22" y1="-8" x2="160" y2="-90" stroke="#2ECC71" stroke-width="4" marker-end="url(#arr-accent)"/>
  </g>
  <text x="780" y="430" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">BRIEF GLANCE</text>
  <text x="780" y="460" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">TO TARGET</text>

  <!-- keeper reading in peripheral (yellow circle below) -->
  <circle cx="540" cy="900" r="40" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>
  <text x="540" y="980" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">KEEPER (PERIPHERAL READ)</text>

  <!-- label for top figure -->
  <text x="540" y="370" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">STRIKER</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Catch the flicker. Don't lock on.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>