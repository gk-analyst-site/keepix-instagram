<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">STORY · A SMALL DETAIL</text>
    <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Watch the gaps between reps.</text>

  <rect x="60" y="360" width="960" height="660" rx="20" ry="20" fill="#1a5c3f"/>
    <rect x="60" y="360" width="960" height="660" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- keeper in set position at center -->
  <g transform="translate(540, 680)">
    <circle cx="0" cy="0" r="46" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>
    <circle cx="-80" cy="25" r="18" fill="#FFD700"/>
    <circle cx="80" cy="25" r="18" fill="#FFD700"/>
    <line x1="-36" y1="15" x2="-70" y2="22" stroke="#FFD700" stroke-width="9" stroke-linecap="round"/>
    <line x1="36" y1="15" x2="70" y2="22" stroke="#FFD700" stroke-width="9" stroke-linecap="round"/>
    <text x="0" y="110" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">SET. HANDS UP. RESET.</text>
  </g>

  <!-- reset-loop arrows around the keeper -->
  <g fill="none" stroke="#2ECC71" stroke-width="4" stroke-dasharray="10,10">
    <path d="M 680 680 A 200 200 0 0 1 680 870" marker-end="url(#arr-accent)"/>
    <path d="M 400 870 A 200 200 0 0 1 400 680" marker-end="url(#arr-accent)"/>
  </g>
  <text x="760" y="790" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">REP</text>
  <text x="290" y="790" font-family="sans-serif" font-weight="800" font-size="22" fill="#2ECC71" letter-spacing="3">RESET</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
    <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">The habit lives between the reps.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>