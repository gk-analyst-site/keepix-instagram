<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <rect x="80" y="230" width="8" height="80" fill="#2ECC71"/>
  <text x="120" y="280" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="5">ENGAGE · COACHES' QUESTION</text>

  <text x="80" y="470" font-family="sans-serif" font-weight="800" font-size="82" fill="#F5F5F0" letter-spacing="-2">What's the drill</text>
  <text x="80" y="570" font-family="sans-serif" font-weight="800" font-size="82" fill="#F5F5F0" letter-spacing="-2">you keep</text>
  <text x="80" y="670" font-family="sans-serif" font-weight="800" font-size="82" fill="#2ECC71" letter-spacing="-2">coming back to?</text>

  <line x1="80" y1="740" x2="300" y2="740" stroke="#F5F5F0" stroke-width="2" opacity="0.4"/>

  <text x="80" y="820" font-family="sans-serif" font-weight="400" font-size="30" fill="#9FBFAE">Not the flashiest one.</text>
  <text x="80" y="866" font-family="sans-serif" font-weight="400" font-size="30" fill="#9FBFAE">The one that always works.</text>

  <rect x="80" y="1130" width="60" height="6" fill="#2ECC71"/>
  <text x="80" y="1200" font-family="sans-serif" font-weight="800" font-size="34" fill="#F5F5F0">Name it below — and tell us why.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>