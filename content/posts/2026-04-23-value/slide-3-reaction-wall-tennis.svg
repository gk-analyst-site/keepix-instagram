<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>

  <!-- arrow marker defs -->
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>

  <!-- small caption row -->
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">DRILL 02  /  3 MIN</text>
  <text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Reaction Wall Tennis</text>

  <!-- pitch area -->
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

    
    <rect x="120" y="330" width="840" height="24" fill="#F5F5F0"/>
    <!-- wall hatching -->
    <g stroke="#0f3d2e" stroke-width="4">
      <line x1="150" y1="330" x2="130" y2="354"/>
      <line x1="240" y1="330" x2="220" y2="354"/>
      <line x1="330" y1="330" x2="310" y2="354"/>
      <line x1="420" y1="330" x2="400" y2="354"/>
      <line x1="510" y1="330" x2="490" y2="354"/>
      <line x1="600" y1="330" x2="580" y2="354"/>
      <line x1="690" y1="330" x2="670" y2="354"/>
      <line x1="780" y1="330" x2="760" y2="354"/>
      <line x1="870" y1="330" x2="850" y2="354"/>
    </g>
    <text x="540.0" y="310" font-family="sans-serif" font-weight="800" font-size="24" fill="#F5F5F0" text-anchor="middle" letter-spacing="3">WALL</text>

    
    <!-- 2m distance indicator -->
    <line x1="540" y1="364" x2="540" y2="630" stroke="#F5F5F0" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>
    <rect x="504" y="487" width="72" height="36" rx="6" fill="#0f3d2e"/>
    <text x="540" y="513" font-family="sans-serif" font-weight="800" font-size="26" fill="#F5F5F0" text-anchor="middle" letter-spacing="2">2 m</text>

    <!-- GK -->
    <circle cx="540" cy="680" r="40" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>
    <!-- one hand up ready -->
    <circle cx="610" cy="640" r="16" fill="#FFD700"/>
    <line x1="570" y1="665" x2="602" y2="644" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
    <text x="540" y="770" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">GK</text>

    
    <circle cx="820" cy="730" r="36" fill="#3498DB" stroke="#0f3d2e" stroke-width="4"/>
    <text x="820" y="810" font-family="sans-serif" font-weight="800" font-size="22" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">COACH</text>

    <!-- throw 1: coach -> wall (dotted) -->
    <path d="M 790 710 Q 600 440 340 356" stroke="#F5F5F0" stroke-width="4" fill="none" stroke-dasharray="10,10" marker-end="url(#arr-white)"/>
    <!-- rebound 2: wall -> GK one-hand (dotted) -->
    <path d="M 340 356 Q 400 540 602 640" stroke="#F5F5F0" stroke-width="4" fill="none" stroke-dasharray="10,10" marker-end="url(#arr-white)"/>

    <!-- small labels on the paths -->
    <text x="720" y="450" font-family="sans-serif" font-weight="800" font-size="20" fill="#F5F5F0" letter-spacing="2">1. THROW</text>
    <text x="300" y="540" font-family="sans-serif" font-weight="800" font-size="20" fill="#F5F5F0" letter-spacing="2">2. REBOUND</text>

    <!-- tennis ball near coach -->
    <circle cx="770" cy="700" r="12" fill="#d4f542" stroke="#0f3d2e" stroke-width="2"/>


  <!-- legend -->
  <g transform="translate(80,1050)">
    <circle cx="18" cy="18" r="14" fill="#FFD700"/>
    <text x="46" y="25" font-family="sans-serif" font-weight="800" font-size="22" fill="#F5F5F0" letter-spacing="2">GK</text>

    <circle cx="140" cy="18" r="14" fill="#3498DB"/>
    <text x="168" y="25" font-family="sans-serif" font-weight="800" font-size="22" fill="#F5F5F0" letter-spacing="2">COACH</text>

    <polygon points="310,32 330,32 320,4" fill="#E67E22"/>
    <text x="342" y="25" font-family="sans-serif" font-weight="800" font-size="22" fill="#F5F5F0" letter-spacing="2">CONE</text>
  </g>
  <!-- takeaway -->
  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
  <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">One hand. Alternate sides.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>