<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <text x="80" y="120" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" letter-spacing="4">SITUATION 02 / THE CUTBACK</text><text x="80" y="185" font-family="sans-serif" font-weight="800" font-size="58" fill="#F5F5F0" letter-spacing="-1">Stay big. Force the commit.</text>
  <rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="#1a5c3f"/><rect x="60" y="260" width="960" height="820" rx="20" ry="20" fill="none" stroke="#F5F5F0" stroke-width="3" opacity="0.25"/>

  <!-- goal at bottom -->
  <rect x="440" y="1050" width="200" height="30" rx="4" fill="none" stroke="#F5F5F0" stroke-width="4" opacity="0.7"/>

  <!-- GK wide between striker and goal centre -->
  <circle cx="500" cy="880" r="36" fill="#FFD700" stroke="#0f3d2e" stroke-width="4"/>

  <!-- body width indicators (wide arms) -->
  <line x1="410" y1="870" x2="600" y2="870" stroke="#FFD700" stroke-width="5" stroke-dasharray="8,4"/>
  <text x="500" y="820" font-family="sans-serif" font-weight="800" font-size="22" fill="#FFD700" text-anchor="middle" letter-spacing="3">STAY WIDE</text>

  <!-- striker has cut inside: positioned right-of-center box -->
  <circle cx="790" cy="670" r="32" fill="#F5F5F0" stroke="#0f3d2e" stroke-width="3"/>
  <text x="790" y="620" font-family="sans-serif" font-weight="800" font-size="20" fill="#9FBFAE" text-anchor="middle" letter-spacing="3">STRIKER</text>

  <!-- striker cut-inside path -->
  <path d="M 900 410 Q 920 570 790 670" stroke="#F5F5F0" stroke-width="4" fill="none" stroke-dasharray="10,8" marker-end="url(#arr-white)"/>

  <!-- "do not dive" annotation -->
  <text x="340" y="750" font-family="sans-serif" font-weight="800" font-size="24" fill="#2ECC71" letter-spacing="3">DO NOT DIVE EARLY</text>
  <text x="340" y="786" font-family="sans-serif" font-weight="400" font-size="22" fill="#9FBFAE" letter-spacing="2">Force the striker to commit first.</text>

  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/><text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="38" fill="#F5F5F0">Patience is the drill.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>