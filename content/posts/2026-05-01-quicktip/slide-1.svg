<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0f3d2e"/>
  <defs>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5F5F0"/>
    </marker>
    <marker id="arr-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD700"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <!-- eyebrow -->
  <text x="540" y="200" font-family="sans-serif" font-weight="800" font-size="26" fill="#2ECC71" text-anchor="middle" letter-spacing="6">QUICK TIP · COACHING CUE</text>

  <!-- hero word -->
  <text x="540" y="480" font-family="sans-serif" font-weight="800" font-size="260" fill="#2ECC71" text-anchor="middle" letter-spacing="-6">RESET</text>

  <!-- divider -->
  <line x1="160" y1="540" x2="920" y2="540" stroke="#F5F5F0" stroke-width="2" opacity="0.3"/>

  <!-- three numbered points -->
  <!-- 1 -->
  <text x="120" y="640" font-family="sans-serif" font-weight="800" font-size="30" fill="#2ECC71" letter-spacing="2">01</text>
  <text x="200" y="640" font-family="sans-serif" font-weight="800" font-size="30" fill="#F5F5F0" letter-spacing="1">AFTER A SAVE</text>
  <text x="200" y="678" font-family="sans-serif" font-weight="400" font-size="26" fill="#9FBFAE">Hands back up before the next ball.</text>

  <!-- 2 -->
  <text x="120" y="770" font-family="sans-serif" font-weight="800" font-size="30" fill="#2ECC71" letter-spacing="2">02</text>
  <text x="200" y="770" font-family="sans-serif" font-weight="800" font-size="30" fill="#F5F5F0" letter-spacing="1">AFTER AN ERROR</text>
  <text x="200" y="808" font-family="sans-serif" font-weight="400" font-size="26" fill="#9FBFAE">One word before they overthink it.</text>

  <!-- 3 -->
  <text x="120" y="900" font-family="sans-serif" font-weight="800" font-size="30" fill="#2ECC71" letter-spacing="2">03</text>
  <text x="200" y="900" font-family="sans-serif" font-weight="800" font-size="30" fill="#F5F5F0" letter-spacing="1">BEFORE A SET PIECE</text>
  <text x="200" y="938" font-family="sans-serif" font-weight="400" font-size="26" fill="#9FBFAE">Posture, position, next rep.</text>

  <!-- bottom accent bar -->
  <rect x="80" y="1150" width="60" height="6" fill="#2ECC71"/>
  <text x="80" y="1220" font-family="sans-serif" font-weight="800" font-size="36" fill="#F5F5F0">Build it in early. Use it forever.</text>

  <circle cx="840" cy="1291" r="5" fill="#2ECC71"/>
  <text x="1020" y="1300" font-family="sans-serif" font-weight="800" font-size="28" fill="#F5F5F0" text-anchor="end" letter-spacing="4">KEEPIX</text>
</svg>